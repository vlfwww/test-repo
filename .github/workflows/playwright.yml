name: CI/CD Multi-Platform Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test on ${{ matrix.os }} / Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run All Tests
      run: npm test
      continue-on-error: true

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-results-${{ matrix.os }}-${{ matrix.node-version }}
        path: |
          allure-results/
          playwright-report/
        retention-days: 30

  deploy:
    name: Deploy Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Allure CLI
      run: npm install -g allure-commandline

    - name: Download Ubuntu Results
      uses: actions/download-artifact@v4
      with:
        name: all-results-ubuntu-latest-22
        path: allure-results

    - name: Generate Final Allure Report
      run: |
        allure generate allure-results --clean -o public

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Send Telegram Notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ Тесты завершены!
          Репозиторий: ${{ github.repository }}
          📊 Отчет Allure: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          ⚙️ Сборка: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}