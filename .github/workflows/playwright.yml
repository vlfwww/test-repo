name: CI/CD Multi-Platform Docker Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            use-docker: true
          - os: windows-latest
            use-docker: false

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js (Windows)
      if: matrix.use-docker == false
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies (Windows)
      if: matrix.use-docker == false
      run: npm ci

    - name: Install Playwright Browsers (Windows)
      if: matrix.use-docker == false
      run: npx playwright install --with-deps chromium

    - name: Run Tests (Windows)
      if: matrix.use-docker == false
      run: npm test
      continue-on-error: true

    - name: Build and Run in Docker (Ubuntu)
      if: matrix.use-docker == true
      run: |
        docker build -t boiler-tests .
        docker run --name test-container boiler-tests || true
        docker cp test-container:/app/allure-results ./allure-results
        docker cp test-container:/app/playwright-report ./playwright-report

    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: all-results-${{ matrix.os }}
        path: |
          allure-results/
          playwright-report/
        retention-days: 30

  deploy:
    name: Deploy Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Download Results
      uses: actions/download-artifact@v4
      with:
        name: all-results-ubuntu-latest
        path: allure-results

    - name: Generate Final Allure Report
      run: |
        npx allure-commandline generate allure-results --clean -o public

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Send Telegram Notification
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ CI/CD Продвинутый уровень завершен!
          Репозиторий: ${{ github.repository }}
          ОС: Ubuntu (Docker) & Windows (Native)
          📊 Отчет: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/