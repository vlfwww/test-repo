name: CI/CD Multi-Platform Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1. ШАГ: Проверка синтаксиса (Actionlint)
  lint:
    name: Lint Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint

  # 2. ШАГ: Тестирование (Матрица ОС и Node.js)
  test:
    needs: lint
    name: Test on ${{ matrix.os }} / Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
        # Указываем, где использовать Docker
        include:
          - os: ubuntu-latest
            use-docker: true
          - os: windows-latest
            use-docker: false
          - os: macos-latest
            use-docker: false

    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    # ЛОГИКА ДЛЯ UBUNTU (Docker)
    - name: Build and Run in Docker (Ubuntu)
      if: matrix.use-docker == true
      run: |
        docker build -t boiler-tests .
        docker run --name test-container boiler-tests || true
        docker cp test-container:/app/allure-results ./allure-results

    # ЛОГИКА ДЛЯ WINDOWS И MAC (Native)
    - name: Setup Node.js ${{ matrix.node-version }}
      if: matrix.use-docker == false
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      if: matrix.use-docker == false
      run: npm ci

    - name: Install Playwright Browsers
      if: matrix.use-docker == false
      run: npx playwright install --with-deps chromium

    - name: Run Tests
      if: matrix.use-docker == false
      run: npm test
      continue-on-error: true

    # Загружаем результаты (Artifacts)
    - name: Upload Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results-${{ matrix.os }}-${{ matrix.node-version }}
        path: allure-results/
        retention-days: 1

  # 3. ШАГ: Деплой отчета
  deploy:
    name: Deploy Allure Report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download All Results
      uses: actions/download-artifact@v4
      with:
        path: all-results
        merge-multiple: true

    - name: Generate Final Allure Report
      run: |
        npx allure-commandline generate all-results --clean -o public

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact to Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Send Telegram Notification
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ✅ Пайплайн завершен!
          ОС: Win, Mac, Ubuntu (Docker)
          Node.js: 18, 20, 22
          📊 Отчет: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/